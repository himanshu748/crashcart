name: Source behavior
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - run: npm ci --ignore-scripts --prefix studio
      - run: npm run build --prefix studio
      - run: npm run test:deadlines --prefix studio
      - run: npm run test:public-timing --prefix studio
      - run: npm run build:timing --prefix studio
      - run: git diff --exit-code -- web/judge/assets/vendor/bryntum
      - run: python -m pip install ruff==0.14.3
      - run: ruff check crashcart
      - run: python -m compileall -q crashcart scripts tests
      - run: node --check web/app.js
      - run: node --check web/marketing.js
      - run: node --check web/judge/motion.js
      - run: node --test tests/test_workspace_api.cjs tests/test_background_ui.cjs tests/test_judge_ui.cjs tests/test_site_illustration.cjs tests/test_judge_motion.cjs
      - run: python -m unittest discover -v
      - run: ./scripts/test-judge.sh
      - run: python scripts/verify_foundation.py
      - run: python -m crashcart prerequisites
      # No provider credentials or external transactions. These local checks do
      # not replace the strict private artifact/phase/release acceptance gate.
