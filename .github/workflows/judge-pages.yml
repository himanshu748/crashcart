name: Recorded walkthrough
"on":
  # Publication is a separate owner-approved action, never a merge side effect.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: recorded-walkthrough-pages
  cancel-in-progress: true
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
      actions: read
    steps:
      - name: Require passing source checks for this exact main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ci_conclusion=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
            --branch main --commit "$GITHUB_SHA" --event push --limit 1 \
            --json conclusion --jq '.[0].conclusion // "missing"')
          if [ "$ci_conclusion" != success ]; then
            echo "Latest Source behavior run for this main commit is not successful. Run CI first." >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'
      - run: python -m unittest tests.test_public_replay tests.test_judge tests.test_judge_assets -v
      - run: python -m crashcart.judge --export-site _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish recorded walkthrough
        id: deployment
        uses: actions/deploy-pages@v4
