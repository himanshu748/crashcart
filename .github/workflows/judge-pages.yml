name: Recorded walkthrough
on:
  workflow_run:
    workflows: [Source behavior]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: recorded-walkthrough-pages
  cancel-in-progress: true
jobs:
  build:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'
      - run: python -m unittest tests.test_public_replay tests.test_judge -v
      - run: python -m crashcart.judge --export-site _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish recorded walkthrough
        id: deployment
        uses: actions/deploy-pages@v4
